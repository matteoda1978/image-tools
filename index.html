<!DOCTYPE html><html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Image Tools - Strumenti gratuiti per immagini</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f8fb;
      color: #172033;
    }

    header {
      text-align: center;
      padding: 55px 20px 35px;
    }

    header h1 {
      font-size: 42px;
      margin: 0 0 15px;
      letter-spacing: -1px;
    }

    header p {
      font-size: 18px;
      color: #667085;
      margin: 0;
    }

    .hero-tools {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .hero-tools span {
      background: white;
      border: 1px solid #e5e7eb;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .tool {
      max-width: 720px;
      margin: 25px auto;
      padding: 30px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    .tool h2 {
      margin-top: 0;
      font-size: 24px;
    }

    input[type="file"] {
      width: 100%;
      padding: 14px;
      margin: 15px 0;
      border: 2px dashed #d0d5dd;
      border-radius: 12px;
      background: #fafafa;
    }

    input[type="number"] {
      padding: 10px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      width: 120px;
    }

    input[type="range"] {
      width: 180px;
      vertical-align: middle;
    }

    select {
      padding: 10px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 20px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 20px;
    }

    a {
      color: #2563eb;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 32px;
      }

      .tool {
        margin: 20px 15px;
        padding: 22px;
      }
    }
  </style></head><body>  <header>
    <h1>Image Tools</h1><p>
  Strumenti gratuiti e semplici per modificare le tue immagini online.
</p>

<div class="hero-tools">
  <span>🖼️ Ridimensiona</span>
  <span>📦 Comprimi</span>
  <span>🔄 Converti</span>
</div>

  </header>  <!-- RIDIMENSIONA -->  <div class="tool"><h2>🖼️ Ridimensiona immagine</h2>

<input type="file" id="imageInput" accept="image/*">

<br>

<label>
  Nuova larghezza:
  <input type="number" id="widthInput" value="800" min="1">
  px
</label>

<br>

<button id="resizeButton">
  Ridimensiona immagine
</button>

<div id="resizeResult" class="result"></div>

  </div>  <!-- COMPRIMI -->  <div class="tool"><h2>📦 Comprimi immagine</h2>

<input type="file" id="compressInput" accept="image/*">

<br>

<label>
  Qualità:
  <input
    type="range"
    id="qualityInput"
    min="10"
    max="100"
    value="70"
  >

  <span id="qualityValue">70</span>%
</label>

<br>

<button id="compressButton">
  Comprimi immagine
</button>

<div id="compressResult" class="result"></div>

  </div>  <!-- CONVERTI -->  <div class="tool"><h2>🔄 Converti immagine</h2>

<input type="file" id="convertInput" accept="image/*">

<br>

<label>
  Formato:

  <select id="formatInput">
    <option value="image/jpeg">JPG</option>
    <option value="image/png">PNG</option>
    <option value="image/webp">WebP</option>
  </select>
</label>

<br>

<button id="convertButton">
  Converti immagine
</button>

<div id="convertResult" class="result"></div>

  </div>  <script>

    /* =========================
       RIDIMENSIONA
       ========================= */

    const imageInput = document.getElementById("imageInput");
    const widthInput = document.getElementById("widthInput");
    const resizeButton = document.getElementById("resizeButton");
    const resizeResult = document.getElementById("resizeResult");

    resizeButton.addEventListener("click", function () {

      if (!imageInput.files.length) {
        resizeResult.textContent = "Seleziona prima un'immagine.";
        return;
      }

      const newWidth = Number(widthInput.value);

      if (!newWidth || newWidth < 1) {
        resizeResult.textContent = "Inserisci una larghezza valida.";
        return;
      }

      const file = imageInput.files[0];
      const image = new Image();

      image.onload = function () {

        const ratio = newWidth / image.width;
        const newHeight = Math.round(image.height * ratio);

        const canvas = document.createElement("canvas");

        canvas.width = newWidth;
        canvas.height = newHeight;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(
          image,
          0,
          0,
          newWidth,
          newHeight
        );

        canvas.toBlob(function (blob) {

          if (!blob) {
            resizeResult.textContent =
              "Impossibile creare l'immagine.";
            return;
          }

          const url = URL.createObjectURL(blob);

          const download = document.createElement("a");

          download.href = url;
          download.download = "immagine-ridimensionata.jpg";
          download.textContent =
            "Scarica immagine ridimensionata";

          resizeResult.innerHTML = "";
          resizeResult.appendChild(download);

        }, "image/jpeg", 0.90);

      };

      image.onerror = function () {
        resizeResult.textContent =
          "Impossibile leggere l'immagine.";
      };

      image.src = URL.createObjectURL(file);

    });


    /* =========================
       COMPRIMI
       ========================= */

    const compressInput =
      document.getElementById("compressInput");

    const qualityInput =
      document.getElementById("qualityInput");

    const qualityValue =
      document.getElementById("qualityValue");

    const compressButton =
      document.getElementById("compressButton");

    const compressResult =
      document.getElementById("compressResult");


    qualityInput.addEventListener("input", function () {

      qualityValue.textContent =
        qualityInput.value;

    });


    compressButton.addEventListener("click", function () {

      if (!compressInput.files.length) {

        compressResult.textContent =
          "Seleziona prima un'immagine.";

        return;
      }

      const file = compressInput.files[0];
      const image = new Image();

      image.onload = function () {

        const canvas =
          document.createElement("canvas");

        canvas.width = image.width;
        canvas.height = image.height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(image, 0, 0);

        const quality =
          Number(qualityInput.value) / 100;

        canvas.toBlob(function (blob) {

          if (!blob) {

            compressResult.textContent =
              "Impossibile comprimere l'immagine.";

            return;
          }

          const url =
            URL.createObjectURL(blob);

          const download =
            document.createElement("a");

          download.href = url;
          download.download =
            "immagine-compressa.jpg";

          download.textContent =
            "Scarica immagine compressa";

          compressResult.innerHTML = "";
          compressResult.appendChild(download);

        }, "image/jpeg", quality);

      };

      image.onerror = function () {

        compressResult.textContent =
          "Impossibile leggere l'immagine.";

      };

      image.src =
        URL.createObjectURL(file);

    });


    /* =========================
       CONVERTI
       ========================= */

    const convertInput =
      document.getElementById("convertInput");

    const formatInput =
      document.getElementById("formatInput");

    const convertButton =
      document.getElementById("convertButton");

    const convertResult =
      document.getElementById("convertResult");


    convertButton.addEventListener("click", function () {

      if (!convertInput.files.length) {

        convertResult.textContent =
          "Seleziona prima un'immagine.";

        return;
      }

      const file = convertInput.files[0];
      const image = new Image();

      image.onload = function () {

        const canvas =
          document.createElement("canvas");

        canvas.width = image.width;
        canvas.height = image.height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(image, 0, 0);

        const format =
          formatInput.value;

        let extension = "jpg";

        if (format === "image/png") {
          extension = "png";
        }

        if (format === "image/webp") {
          extension = "webp";
        }

        canvas.toBlob(function (blob) {

          if (!blob) {

            convertResult.textContent =
              "Impossibile convertire l'immagine.";

            return;
          }

          const url =
            URL.createObjectURL(blob);

          const download =
            document.createElement("a");

          download.href = url;

          download.download =
            "immagine-convertita." +
            extension;

          download.textContent =
            "Scarica immagine convertita";

          convertResult.innerHTML = "";
          convertResult.appendChild(download);

        }, format, 0.90);

      };

      image.onerror = function () {

        convertResult.textContent =
          "Impossibile leggere l'immagine.";

      };

      image.src =
        URL.createObjectURL(file);

    });

  </script></body>
</html>
