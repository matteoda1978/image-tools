      text-align: center;

      overflow: hidden;
    }

    .hero::before {

      height: 400px;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      background: #263f78;

      font-size: 24px;
      line-height: 1.3;
      font-weight: 700;
      color: #dce5ff;

    .hero h1 .brand-word {

      background-clip: text;
      -webkit-text-fill-color: transparent;
      overflow-wrap: anywhere;
    }

    .hero h1 .tagline {

    .hero-button {
