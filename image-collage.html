<head>
  <meta charset="UTF-8">

  <title>Photo Collage Maker - Crea collage di foto online</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #e2e6ed;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --soft: #eef4ff;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: #111827;
      color: white;
      padding: 28px 20px 30px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -0.5px;
    }

    header p {
      margin: 8px 0 0;
      color: #cbd5e1;
      font-size: 15px;
    }

    main {
      width: 100%;
      max-width: 1120px;
      margin: 28px auto;
      padding: 0 18px 50px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 22px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
    }

    .panel h2 {
      margin: 0 0 18px;
      font-size: 18px;
    }

    .upload {
      border: 2px dashed #b7c0ce;
      background: #f8fafc;
      border-radius: 14px;
      padding: 25px 15px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload:hover {
      border-color: var(--primary);
      background: var(--soft);
    }

    .upload-icon {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .upload strong {
      display: block;
      font-size: 16px;
    }

    .upload span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    #fileInput {
      display: none;
    }

    .section {
      margin-top: 22px;
    }

    .section-title {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 9px;
      color: #344054;
    }

    .layout-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .layout-btn {
      border: 1px solid var(--border);
      background: white;
      border-radius: 10px;
      min-height: 62px;
      padding: 7px;
      cursor: pointer;
      font-size: 11px;
      color: #475467;
    }

    .layout-btn.active {
      border: 2px solid var(--primary);
      background: var(--soft);
      color: var(--primary);
      font-weight: bold;
    }

    .mini-layout {
      width: 100%;
      height: 32px;
      display: grid;
      gap: 2px;
      margin-bottom: 5px;
    }

    .mini-layout span {
      background: #94a3b8;
      border-radius: 2px;
    }

    .layout-btn.active .mini-layout span {
      background: var(--primary);
    }

    .two {
      grid-template-columns: 1fr 1fr;
    }

    .three {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    .three span:first-child {
      grid-row: 1 / 3;
    }

    .four {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
