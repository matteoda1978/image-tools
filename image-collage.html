<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Photo Collage Maker - Crea collage di foto online</title>
  <meta name="description" content="Crea collage di foto online gratuitamente. Unisci più immagini, scegli il layout, lo spazio e lo sfondo e scarica il risultato.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      color: #cbd5e1;
      font-size: 15px;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 18px 50px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .upload-box {
      border: 2px dashed #94a3b8;
      border-radius: 14px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
      background: #f8fafc;
      transition: 0.2s;
    }

    .upload-box:hover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .upload-box strong {
      display: block;
      font-size: 20px;
      margin-bottom: 8px;
    }

    .upload-box span {
      color: #64748b;
      font-size: 14px;
    }

    #fileInput {
      display: none;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 20px;
    }

    .control {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    select,
    input[type="range"],
    input[type="color"] {
      width: 100%;
    }

    select {
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: white;
      font-size: 15px;
    }

    input[type="color"] {
      height: 42px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 3px;
      background: white;
    }

    .value {
      font-size: 13px;
      color: #64748b;
    }

    .preview-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .preview-title h2 {
      margin: 0;
      font-size: 20px;
    }

    #photoCount {
      color: #64748b;
      font-size: 14px;
    }

    .canvas-wrap {
      width: 100%;
      overflow-x: auto;
      background: #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 5px;
      background: white;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e2e8f0;
      color: #172033;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .empty {
      color: #64748b;
      padding: 35px 10px;
      text-align: center;
    }

    .thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    .thumb {
      aspect-ratio: 1;
      border-radius: 9px;
      overflow: hidden;
      background: #e2e8f0;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .info {
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 15px;
    }

    @media (max-width: 650px) {
      header h1 {
        font-size: 25px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 16px;
      }

      main {
        margin-top: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Photo Collage Maker</h1>
  <p>Crea un collage di foto online gratuitamente</p>
</header>

<main>

  <section class="card">

    <label class="upload-box" for="fileInput">
      <strong>📷 Carica le tue foto</strong>
      <span>Seleziona due o più immagini dal dispositivo</span>
    </label>

    <input
      type="file"
      id="fileInput"
      accept="image/*"
      multiple
    >

    <div class="controls">

      <div class="control">
        <label for="layout">Layout</label>

        <select id="layout">
          <option value="1">1 colonna</option>
          <option value="2" selected>2 colonne</option>
          <option value="3">3 colonne</option>
          <option value="4">4 colonne</option>
        </select>
      </div>

      <div class="control">
        <label for="format">Formato</label>

        <select id="format">
          <option value="square">Quadrato</option>
          <option value="portrait">Verticale</option>
          <option value="landscape">Orizzontale</option>
        </select>
      </div>

      <div class="control">
        <label for="spacing">Spazio tra le foto</label>

        <input
          type="range"
          id="spacing"
          min="0"
          max="40"
          value="10"
        >

        <span class="value" id="spacingValue">10 px</span>
      </div>

      <div class="control">
        <label for="background">Colore sfondo</label>

        <input
          type="color"
          id="background"
          value="#ffffff"
        >
      </div>

    </div>

    <div class="thumbs" id="thumbs"></div>

  </section>

  <section class="card">

    <div class="preview-title">
      <h2>Anteprima</h2>
      <span id="photoCount">Nessuna foto</span>
    </div>

    <div class="canvas-wrap">

      <div class="empty" id="emptyMessage">
        Carica almeno due foto per creare il collage.
      </div>

      <canvas id="canvas" style="display:none;"></canvas>

    </div>

    <div class="actions">

      <button
        type="button"
        class="primary"
        id="downloadJpg"
        disabled
      >
        Scarica JPG
      </button>

      <button
        type="button"
        class="secondary"
        id="downloadPng"
        disabled
      >
        Scarica PNG
      </button>

    </div>

    <div class="info">
      Le immagini vengono elaborate direttamente nel browser.
      Non vengono caricate su un server.
    </div>

  </section>

</main>

<script>

  const fileInput = document.getElementById("fileInput");
  const layoutSelect = document.getElementById("layout");
  const formatSelect = document.getElementById("format");
  const spacingInput = document.getElementById("spacing");
  const spacingValue = document.getElementById("spacingValue");
  const backgroundInput = document.getElementById("background");

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const thumbs = document.getElementById("thumbs");
  const photoCount = document.getElementById("photoCount");
  const emptyMessage = document.getElementById("emptyMessage");

  const downloadJpg = document.getElementById("downloadJpg");
  const downloadPng = document.getElementById("downloadPng");

  let images = [];

  fileInput.addEventListener("change", function () {

    const files = Array.from(fileInput.files);

    if (!files.length) {
      return;
    }

    images = [];

    let loaded = 0;

    files.forEach(file => {

      if (!file.type.startsWith("image/")) {
        return;
      }

      const reader = new FileReader();

      reader.onload = function(event) {

        const img = new Image();

        img.onload = function() {

          images.push(img);
          loaded++;

          if (loaded === files.filter(f => f.type.startsWith("image/")).length) {
            updateThumbnails();
            createCollage();
          }

        };

        img.src = event.target.result;

      };

      reader.readAsDataURL(file);

    });

  });

  layoutSelect.addEventListener("change", createCollage);
  formatSelect.addEventListener("change", createCollage);
  spacingInput.addEventListener("input", function() {

    spacingValue.textContent = spacingInput.value + " px";

    createCollage();

  });

  backgroundInput.addEventListener("input", createCollage);

  function updateThumbnails() {

    thumbs.innerHTML = "";

    images.forEach(img => {

      const div = document.createElement("div");
      div.className = "thumb";

      const image = document.createElement("img");
      image.src = img.src;
      image.alt = "Foto caricata";

      div.appendChild(image);
      thumbs.appendChild(div);

    });

    photoCount.textContent =
      images.length + (images.length === 1 ? " foto" : " foto");

  }

  function getCanvasSize() {

    const format = formatSelect.value;

    if (format === "portrait") {
      return {
        width: 1080,
        height: 1350
      };
    }

    if (format === "landscape") {
      return {
        width: 1200,
        height: 800
      };
    }

    return {
      width: 1080,
      height: 1080
    };

  }

  function createCollage() {

    if (images.length < 1) {

      canvas.style.display = "none";
      emptyMessage.style.display = "block";

      downloadJpg.disabled = true;
      downloadPng.disabled = true;

      return;
    }

    canvas.style.display = "block";
    emptyMessage.style.display = "none";

    downloadJpg.disabled = false;
    downloadPng.disabled = false;

    const size = getCanvasSize();

    canvas.width = size.width;
    canvas.height = size.height;

    ctx.fillStyle = backgroundInput.value;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const columns = Math.max(
      1,
      Math.min(
        parseInt(layoutSelect.value),
        images.length
      )
    );

    const rows = Math.ceil(images.length / columns);

    const spacing = parseInt(spacingInput.value);

    const cellWidth =
      (canvas.width - spacing * (columns + 1)) / columns;

    const cellHeight =
      (canvas.height - spacing * (rows + 1)) / rows;

    images.forEach((img, index) => {

      const column = index % columns;
      const row = Math.floor(index / columns);

      const x =
        spacing + column * (cellWidth + spacing);

      const y =
        spacing + row * (cellHeight + spacing);

      drawCoverImage(
        img,
        x,
        y,
        cellWidth,
        cellHeight
      );

    });

  }

  function drawCoverImage(img, x, y, width, height) {

    const imageRatio =
      img.width / img.height;

    const boxRatio =
      width / height;

    let sourceWidth = img.width;
    let sourceHeight = img.height;
    let sourceX = 0;
    let sourceY = 0;

    if (imageRatio > boxRatio) {

      sourceWidth =
        img.height * boxRatio;

      sourceX =
        (img.width - sourceWidth) / 2;

    } else {

      sourceHeight =
        img.width / boxRatio;

      sourceY =
        (img.height - sourceHeight) / 2;

    }

    ctx.drawImage(
      img,
      sourceX,
      sourceY,
      sourceWidth,
      sourceHeight,
      x,
      y,
      width,
      height
    );

  }

  function download(format) {

    if (!images.length) {
      return;
    }

    const mime =
      format === "jpg"
        ? "image/jpeg"
        : "image/png";

    const extension =
      format === "jpg"
        ? "jpg"
        : "png";

    canvas.toBlob(function(blob) {

      if (!blob) {
        return;
      }

      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement("a");

      link.href = url;

      link.download =
        "photo-collage." + extension;

      document.body.appendChild(link);

      link.click();

      link.remove();

      URL.revokeObjectURL(url);

    }, mime, 0.92);

  }

  downloadJpg.addEventListener(
    "click",
    function() {
      download("jpg");
    }
  );

  downloadPng.addEventListener(
    "click",
    function() {
      download("png");
    }
  );

</script>

</body>
</html>
